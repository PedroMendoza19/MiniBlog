<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}til/ — Dev Log{% endblock %}</title>
  <script>
    // Aplica el tema guardado antes de pintar, para evitar el parpadeo.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f6f5c'/><text x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'>t/</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="logo" href="/"><span class="logo__mark">til</span><span class="logo__slash">/</span></a>
      <nav class="nav">
        {% set on_calendar = request.url.path == "/calendar" %}
        <a class="nav__link{% if on_calendar %} is-active{% endif %}" href="{{ '/' if on_calendar else '/calendar' }}"
           title="{{ 'Volver al inicio' if on_calendar else 'Ver entries por mes' }}"
           {% if on_calendar %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Calendario</span>
        </a>
        <a class="nav__link" href="/random" title="Repasar algo al azar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          <span>Al azar</span>
        </a>
        <a class="nav__link" href="/docs" title="Documentación de la API">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg>
          <span>API</span>
        </a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="btn btn--primary" href="/new">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Nueva entry</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <span>Hecho con FastAPI · un día a la vez</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
